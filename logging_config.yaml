version: 1
disable_existing_loggers: False
formatters:
  simple:
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
handlers:
  rotating_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: simple
    filename: ./logs/app.log
    maxBytes: 104857600  # 100 MB
    backupCount: 3
    encoding: utf8
loggers:
  '':
    level: INFO
    handlers: [rotating_file]
    propagate: yes